<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eddie Tools Alpha</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="app">

        <header class="header">
            <h1>Eddie Tools Alpha</h1>

        </header>

                <button id="btnNewDocument">

                <button id="btnOpenFolder">

            </section>

            <section class="console">

                <h3>Console</h3>

                <div id="log">

                    Eddie Tools Alpha Ready

                </div>

            </section>

        </main>

    </div>

    <script src="main.js"></script>
